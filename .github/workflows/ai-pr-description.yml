name: AI PR Description

on:
  workflow_call:
    inputs:
      repo_type:
        description: "Type of repository: frontend | dotnet | terraform"
        type: string
        required: true
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  ai-pr-description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Generate PR description
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF=$(cat diff.txt | head -c 6000)
          REPO_TYPE="${{ inputs.repo_type }}"

          PROMPT="You are a senior $REPO_TYPE engineer. Based on this git diff, generate a clear and professional pull request description.

          Return exactly this format:

          ## What changed
          A 2-3 sentence summary of what this PR does.

          ## Why
          Brief explanation of the reason or motivation.

          ## Type of change
          Check all that apply (replace [ ] with [x]):
          - [ ] Bug fix
          - [ ] New feature
          - [ ] Refactor
          - [ ] Performance improvement
          - [ ] Security fix
          - [ ] Infrastructure change
          - [ ] Documentation update

          ## Testing
          Brief note on how this was or should be tested.

          DIFF:
          $DIFF"

          RESPONSE=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": $(echo "$PROMPT" | jq -Rs .)
                }]
              }],
              \"generationConfig\": {
                \"temperature\": 0.3,
                \"maxOutputTokens\": 800
              }
            }")

          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' > description.txt

          if [ ! -s description.txt ]; then
            echo "⚠️ AI description could not be generated." > description.txt
          fi

      - name: Update PR description
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const description = fs.readFileSync('description.txt', 'utf8');

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const currentBody = pr.data.body || '';
            const isEmpty = currentBody.trim() === '' || currentBody.trim() === '<!-- PR description -->';

            if (isEmpty) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body: `${description}\n\n---\n*Description generated by Gemini 2.0 Flash · [devops-templates](https://github.com/${{ github.repository_owner }}/devops-templates)*`
              });
              console.log('PR description updated.');
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📝 AI Suggested PR Description\n\n${description}\n\n---\n*Your PR already has a description — this is a suggestion only.*`
              });
            }
