name: AI PR Review

on:
  workflow_call:
    inputs:
      repo_type:
        description: "Type of repository: frontend | dotnet | terraform"
        type: string
        required: true
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Set repo-specific review prompt
        id: prompt
        run: |
          REPO_TYPE="${{ inputs.repo_type }}"

          if [ "$REPO_TYPE" = "frontend" ]; then
            EXTRA="Focus on: React/JS best practices, accessibility (a11y), CSS issues, performance (re-renders, large bundles), XSS risks, missing error boundaries."
          elif [ "$REPO_TYPE" = "dotnet" ]; then
            EXTRA="Focus on: async/await misuse, SOLID violations, null reference risks, EF Core N+1 queries, dependency injection issues, exception handling."
          elif [ "$REPO_TYPE" = "terraform" ]; then
            EXTRA="Focus on: hardcoded secrets/values, overly permissive IAM/security groups, missing tags, state file risks, resource naming conventions, cost implications."
          else
            EXTRA="Apply general software engineering best practices."
          fi

          echo "extra_prompt=$EXTRA" >> $GITHUB_OUTPUT

      - name: Run AI Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF=$(cat diff.txt | head -c 8000)
          REPO_TYPE="${{ inputs.repo_type }}"
          EXTRA="${{ steps.prompt.outputs.extra_prompt }}"

          PROMPT="You are a senior $REPO_TYPE engineer doing a thorough pull request review.
          $EXTRA

          Analyze the diff and return your review in this exact format:

          ## 🐛 Bugs & Logic Errors
          List any bugs or logic issues found. If none, write 'None found.'

          ## 🔒 Security Issues
          List security vulnerabilities. If none, write 'None found.'

          ## 📋 Code Quality & Best Practices
          List quality issues, anti-patterns, or improvements. If none, write 'Looks good.'

          ## ✅ Summary
          One sentence overall assessment.

          Be concise and actionable. Only flag real issues, not style preferences.

          DIFF:
          $DIFF"

          RESPONSE=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": $(echo "$PROMPT" | jq -Rs .)
                }]
              }],
              \"generationConfig\": {
                \"temperature\": 0.2,
                \"maxOutputTokens\": 1024
              }
            }")

          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' > review.txt

          if [ ! -s review.txt ]; then
            echo "⚠️ AI review could not be generated." > review.txt
          fi

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.txt', 'utf8');
            const repoType = '${{ inputs.repo_type }}';
            const emoji = { frontend: '🌐', dotnet: '⚙️', terraform: '🏗️' }[repoType] || '🤖';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} AI Code Review (${repoType})\n\n${review}\n\n---\n*Powered by Gemini 2.0 Flash · [devops-templates](https://github.com/${{ github.repository_owner }}/devops-templates)*`
            });
